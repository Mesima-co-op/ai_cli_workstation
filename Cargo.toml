[package]
name = "aiws"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
dirs = "7.0.0"
futures = "0.3.34"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
